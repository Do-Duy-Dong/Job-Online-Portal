version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgres://db:5432/app-db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=123456
    depends_on:
      - postgres
    networks:
      - default
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=app-db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=12345
    ports:
      - "5433:5432"
    volumes:
      - db_data:var/lib/postgresql/data
    networks:
      - default
volumes:
  db_data:
networks:
  default:
    driver: bridge